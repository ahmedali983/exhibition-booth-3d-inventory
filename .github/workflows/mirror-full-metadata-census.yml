name: ExpoVault Exhaustive CC Exhibition Booth Metadata Census
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/mirror-full-metadata-census.yml]
permissions: {contents: read}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/mirror_metadata_remaining.py
      - run: python -m pip install -q requests
      - name: Discover metadata only, no archive downloads
        env:
          SCAN_GROUP: ${{ matrix.group }}
        run: python -u scripts/mirror_metadata_remaining.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-CC-booth-candidates-${{ matrix.group }}
          path: mirror-title-discovery-${{ matrix.group }}/
          retention-days: 7
          if-no-files-found: warn
