name: ExpoVault Quality Review New CC Booths C-D
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/qa-mirror-C-D.yml]
permissions:
  contents: read
  actions: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/qa_remaining_mirror_booth_sources.py
            catalog/verified_drive_inventory_quality_142_20261106.json
      - uses: actions/download-artifact@v4
        with:
          name: expovault-CC-booth-candidates-C
          run-id: 42159709977
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/C
      - uses: actions/download-artifact@v4
        with:
          name: expovault-CC-booth-candidates-D
          run-id: 42159709977
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/D
      - run: python -m pip install -q requests pillow
      - run: python -u scripts/qa_remaining_mirror_booth_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: expovault-new-CC-booths-visual-QA-C-D
          path: mirror-fresh-candidates/
          retention-days: 7
          if-no-files-found: error
