name: ExpoVault worldwide authorized model source preflight
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-worldwide-source-preflight.yml]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            catalog/worldwide_licensed_booth_candidates_20261106.json
            scripts/expovault_verify_worldwide_originals.py
      - run: python -m pip install -q requests pillow
      - name: Verify public archived original glTF/source without downloading locked files
        run: python -u scripts/expovault_verify_worldwide_originals.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-worldwide-source-audit-${{ matrix.shard }}
          path: worldwide-source-qa/${{ matrix.shard }}/
          retention-days: 7
          if-no-files-found: warn
