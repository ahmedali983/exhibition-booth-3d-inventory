name: ExpoVault Scan High-Aesthetic GitHub 3D Scene Files
on:
  push:
    branches: [research/expovault-trellis-aesthetic-20261105]
    paths: [.github/workflows/search-curated-github-3d.yml]
permissions: {contents: read}
jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/scan_trellis_github_booths.py
      - run: python -m pip install -q requests
      - run: python scripts/scan_trellis_github_booths.py
      - uses: actions/upload-artifact@v4
        with:
          name: expovault-github-high-aesthetic-original-booth-shortlist
          path: trellis-github-booth-scan/
          retention-days: 14
          if-no-files-found: error

# Rerun after increasing GitHub-source metadata CSV stream size cap to 520 MB.
