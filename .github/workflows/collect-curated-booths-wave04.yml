name: ExpoVault New Real Booths Source Archive Wave 04
on:
  push:
    branches: [research/expovault-open-archive-catalogue-20261105]
    paths: [.github/workflows/collect-curated-booths-wave04.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        uid:
          - 3ec62777dc614d8cb8a4f90ac49569ed
          - ace1fa191ea54587bbc335391f1ff1b1
          - bc60786f16b447e9827e83339e6ead1d
          - d922d41591dd4279a957a6d80e366a7f
          - 3fed9b4cc3e74f4199c1d838ee2836e9
          - b8b18d92576d4e5cb8567e59bd254db9
          - d9ce01ee574847e88b50b5a80c348036
          - 4b75f0246eb749b1bda39c2ee6004335
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/collect_creator_stand_from_open_mirror.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - name: Import licensed creator booth GLB and source
        run: python scripts/collect_creator_stand_from_open_mirror.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-creator-booth-${{ matrix.uid }}
          path: collected-${{ matrix.uid }}/*-REAL-GLB-AND-CREATOR-SOURCE.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
