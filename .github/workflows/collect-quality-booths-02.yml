name: ExpoVault High Aesthetic Licensed Booth Collection 02
on:
  push:
    branches: [research/expovault-trellis-aesthetic-20261105]
    paths: [.github/workflows/collect-quality-booths-02.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        uid:
          - 573a63f0222942d7b848f71562ae9f14
          - cee16e22beaa44c3805a7eb8bd8c5a95
          - 89a98f342d394326a8c123c483da392d
          - 1ad2a14edf434982b3005b7739f8f193
          - 771c524cabb54896a24fdae884f08974
          - 7d46a4fbd5a94b2487a810b105e529fc
          - e66e1f99149c4f868867636c30af9135
          - 048de16d9edf42f5903c3c829a1a05c9
          - e5eeea956e1e48fbb93a8dd5d0fac4da
          - 6ec839cd9777491e9cb911fdf296a124
          - d1690cfb32c4406eb5b22ee9c3bbd226
          - c9b132cdab3648979b01695573c35aed
          - 3c34ee10443a442e9df5b2ef6bad5501
          - 70462312d2814a358f21369fc7be1a5c
          - 93b596e1ed0b41afb679f59a6f07a2b3
          - aedce51a1a5747369d812f290a94d425
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/collect_creator_trellis_booth.py
      - run: python -m pip install -q requests pillow
      - run: npm install --global @gltf-transform/cli@4
      - name: Check model CC rights, convert glTF to GLB, preserve source files
        run: python scripts/collect_creator_trellis_booth.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-quality2-${{ matrix.uid }}-full
          path: trellis-collected-${{ matrix.uid }}/*-REAL-GLB-AND-CREATOR-SOURCE.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-quality2-${{ matrix.uid }}-glb
          path: trellis-collected-${{ matrix.uid }}/*-GLB-ONLY.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-quality2-${{ matrix.uid }}-native
          path: trellis-collected-${{ matrix.uid }}/*-CREATOR-SOURCE-ONLY.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
