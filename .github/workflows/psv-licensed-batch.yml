name: ExpoVault CC Booth Source Batch
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/psv-licensed-batch.yml]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: [glbs-0008, glbs-0040, glbs-0062]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/psv_http_range.py
            scripts/psv_batch_shard.py
            scripts/filter_psv_bulk_candidates.py
            catalog/bulk_import_existing_uids.json
      - run: python -m pip install -q requests pandas pyarrow huggingface_hub
      - run: python scripts/filter_psv_bulk_candidates.py
      - run: python scripts/psv_batch_shard.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psv-licensed-${{ matrix.shard }}
          path: output-${{ matrix.shard }}/
          retention-days: 7
