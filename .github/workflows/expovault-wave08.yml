name: ExpoVault Two Original Booth Designs Wave 08
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-wave08.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        uid: [dbbbc2e3026a471ab625bd4e5c8715f4, 2805e8343ca443b598d232ae0ee59f1a]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/collect_licensed_bulk_creator_booth.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - run: python scripts/collect_licensed_bulk_creator_booth.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave08-${{ matrix.uid }}
          path: bulk-booth-${{ matrix.uid }}/*.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
