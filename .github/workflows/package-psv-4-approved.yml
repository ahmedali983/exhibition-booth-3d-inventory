name: ExpoVault Package Four Approved Original Booth GLBs
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/package-psv-4-approved.yml]
permissions:
  contents: read
  actions: read
jobs:
  approved:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: psv-licensed-glbs-0018
          run-id: 42094394660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/0018
      - uses: actions/download-artifact@v4
        with:
          name: psv-licensed-glbs-0044
          run-id: 42094394660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/0044
      - uses: actions/download-artifact@v4
        with:
          name: psv-licensed-glbs-0064
          run-id: 42094394660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/0064
      - name: Promote original CC GLBs that passed visual review
        run: |
          python - <<'PY'
          import pathlib,zipfile,io,hashlib,json
          approved=[
            ("0018","62f1ce23a16041358834f70995af3002"),
            ("0044","efb2d9f282db4757abe218a46c00f592"),
            ("0044","f0b925c7cbc74594a64837a1c8d8017d"),
            ("0064","c66f3bff0549483ab2d527d9a5555d28")
          ]
          root=pathlib.Path("final-original-booths")
          root.mkdir(exist_ok=True)
          index=[]
          for shard,uid in approved:
            f=pathlib.Path("source")/shard/("PSV-"+uid+"-GLB-CC.zip")
            with zipfile.ZipFile(f) as z:
              assert z.testzip() is None
              info=json.loads(z.read("MODEL_INFO.json"))
              assert info["uid"]==uid and info["license"] in ("by","by-sa","cc0")
              data=z.read("original.glb")
              assert hashlib.sha256(data).hexdigest()==info["sha256"]
              asset=root/("PSV-"+uid);asset.mkdir()
              (asset/"original.glb").write_bytes(data)
              (asset/"MODEL_INFO.json").write_text(json.dumps(info,indent=2,ensure_ascii=False),encoding="utf8")
              (asset/"CREATOR_CREDIT.txt").write_bytes(z.read("CREATOR_CREDIT.txt"))
              index.append({"uid":uid,"title":info["name"],"creator":info["creator"],
                "source":info["sketchfab_url"],"license":info["license"],"bytes":len(data),
                "sha256":info["sha256"],"visual_quality_gate":"PASS","production_documentation":"NOT PROVIDED"})
              print("ACCEPTED",uid,info["name"],len(data),flush=True)
          (root/"BATCH_INDEX.json").write_text(json.dumps({"count":len(index),"models":index},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expovault-four-verified-prosceneverse-original-glbs
          path: final-original-booths/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
