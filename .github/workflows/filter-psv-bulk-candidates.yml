name: ExpoVault Filter Bulk ProSceneverse 3D Booth Candidates
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/filter-psv-bulk-candidates.yml]
permissions: {contents: read}
jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/filter_psv_bulk_candidates.py
            catalog/bulk_import_existing_uids.json
      - run: python -m pip install -q pandas pyarrow requests huggingface_hub
      - run: python -u scripts/filter_psv_bulk_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: expovault-ranked-bulk-prosceneverse-booth-candidates
          path: psv-bulk-candidates/
          retention-days: 7
