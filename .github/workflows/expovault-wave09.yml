name: ExpoVault Six Newly Discovered Original Booths Wave09
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-wave09.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        uid:
          - 878a1f0783964860a2e8b8727cfdbc4f
          - 5b069d007b4347e59a20817f9557841d
          - d3028eed76064c4d86bfb651320d5748
          - 2b11ff2367434aaabb9ab33f285d6182
          - a35d8a5f93014b7684c61cbc496e1513
          - 3739467115ca49c79dc685b571af4d91
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/rescue_large_creator_booth_sources.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - run: python -u scripts/rescue_large_creator_booth_sources.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave09-${{ matrix.uid }}-full
          path: rescue-booth-${{ matrix.uid }}/*-REAL-GLB-AND-CREATOR-SOURCE.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave09-${{ matrix.uid }}-glb
          path: rescue-booth-${{ matrix.uid }}/*-GLB-ONLY.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave09-${{ matrix.uid }}-native
          path: rescue-booth-${{ matrix.uid }}/*-CREATOR-SOURCE-ONLY.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
