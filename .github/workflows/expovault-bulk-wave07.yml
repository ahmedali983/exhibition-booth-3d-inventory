name: ExpoVault CC Original Booth Bulk Wave 07
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-bulk-wave07.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        uid:
          - b922a5c79d9c4e0db247ed9ae08a4693
          - afefb075173d449ba2b679cd4f6bad78
          - 74581c444a8e41588936314fafdb50e3
          - 47f26d0f04c547dba87da1891e178f59
          - 683091053dcb4915aade7179acc331a3
          - fbfd9234d2394ee299cb3c16d0513488
          - fbff1af6eb6c43bcbf718a5e040e67de
          - a44539ed2c0445b2b0681d627ada3740
          - eb2a6f247cde49fbb1943c4ecab2f2de
          - 3e29c75eb7cb4bcd935ae94f0ca3b7e3
          - 0830d74c7687476e99040bce4b86af1a
          - 3fcd49dac9a344769d7f4bf6d4c71c2c
          - 8c2ad81f477441798b865bc9d5a507b6
          - c4db98f5ffe34a4a928990a1d8f6d8b6
          - a2f3122e874b4ed29721e0161a4e2b34
          - 7efcadaad23f460485c1e9758a4645c8
          - 04fe1e088fe7435eb0bf88f4bdb12b9e
          - 3b7c3d047fcb4a85925980fd830a43e6
          - df171c17351e473c8af8f0cc829a613f
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/collect_licensed_bulk_creator_booth.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - name: Extract CC-licensed exhibition booth GLB and original author source
        run: python scripts/collect_licensed_bulk_creator_booth.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave07-${{ matrix.uid }}
          path: bulk-booth-${{ matrix.uid }}/*.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
