name: ExpoVault 20x30 Creator Original Source Large Design
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-extra-large-20x30.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/collect_extra_large_booth_source.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - run: python -u scripts/collect_extra_large_booth_source.py 25a38668148847a3ac36c3e318545cd5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-20x30-original-glb
          path: extra-large-booth-25a38668148847a3ac36c3e318545cd5/*-GLB-ONLY.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-20x30-author-source-part01
          path: extra-large-booth-25a38668148847a3ac36c3e318545cd5/*.part01
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-20x30-author-source-part02
          path: extra-large-booth-25a38668148847a3ac36c3e318545cd5/*.part02
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-20x30-author-source-part03
          path: extra-large-booth-25a38668148847a3ac36c3e318545cd5/*.part03
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-20x30-author-source-reassembly
          path: extra-large-booth-25a38668148847a3ac36c3e318545cd5/*-SOURCE-SPLIT-MANIFEST.json
          retention-days: 7
          if-no-files-found: warn
