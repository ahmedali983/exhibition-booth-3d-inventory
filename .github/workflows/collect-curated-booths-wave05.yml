name: ExpoVault New Real Booths Source Archive Wave 05
on:
  push:
    branches: [research/expovault-open-archive-catalogue-20261105]
    paths: [.github/workflows/collect-curated-booths-wave05.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        uid:
          - 2fb735c4ccc64eb7860eb1ad727cb82e
          - 34ff5f2693a649478caccf99aea4e6c6
          - b5db4e32f8c64c93ba88666f1d417ab3
          - 878a1f0783964860a2e8b8727cfdbc4f
          - 510c0c5188d04784a462db88456b2217
          - b706b30b9a3e4f7e95e90b92e5f4b493
          - 99e582c1931145f198711eaa4e2b4ead
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/collect_creator_stand_from_open_mirror.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - run: python scripts/collect_creator_stand_from_open_mirror.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave05-${{ matrix.uid }}-full
          path: collected-${{ matrix.uid }}/*-REAL-GLB-AND-CREATOR-SOURCE.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave05-${{ matrix.uid }}-glb
          path: collected-${{ matrix.uid }}/*-GLB-ONLY.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave05-${{ matrix.uid }}-native
          path: collected-${{ matrix.uid }}/*-CREATOR-SOURCE-ONLY.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
