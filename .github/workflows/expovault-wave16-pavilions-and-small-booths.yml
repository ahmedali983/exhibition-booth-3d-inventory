name: ExpoVault Wave16 worldwide CC pavilions and local booths
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-wave16-pavilions-and-small-booths.yml]
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        uid:
          - 61896f2f049c4a47a2914ec76ea36990
          - 143ac821a3984e299e2196646aa2e41d
          - cc545abb605448adbc50ef090dd10154
          - 81ee87974c5e4627968ba3072545dd38
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/rescue_large_creator_booth_sources.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - name: Authored 3D source / CC license / rights gate
        run: python -u scripts/rescue_large_creator_booth_sources.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave16-${{ matrix.uid }}
          path: rescue-booth-${{ matrix.uid }}/*.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
