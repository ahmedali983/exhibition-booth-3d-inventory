name: ExpoVault Verify 188 Live CC Sketchfab Model Sources
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/qa-sketchfab-188-licensed-sources.yml]
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/scan_sketchfab_cc188_archive.py
            catalog/sketchfab_multilingual_cc_188_candidates_20261106.json
            catalog/verified_drive_inventory_quality_142_20261106.json
      - run: python -m pip install -q requests pillow
      - name: Check original author archives for 188 currently CC downloadable Sketchfab sources
        run: python -u scripts/scan_sketchfab_cc188_archive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-sketchfab-188-open-originals-quality-source-QA
          path: sketchfab-188-source-qa/
          retention-days: 7
          if-no-files-found: warn
