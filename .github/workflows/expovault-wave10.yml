name: ExpoVault Five Newly Licensed Creator Booths Wave10
on:
  push:
    branches: [feature/expovault-bulk-range-prosceneverse]
    paths: [.github/workflows/expovault-wave10.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        uid:
          - 19bf984c0fb3433fb1e9ab09e939c29f
          - 4582bc92f181424286872ace8aca2703
          - 69ef43d6966440f292ac79691e776f19
          - 811d84f47e4d4deba206137b5e880081
          - 95e1012adaa4489bae40fff91cdb6dd4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/rescue_large_creator_booth_sources.py
      - run: python -m pip install -q requests pillow
      - run: npm install -g @gltf-transform/cli@4
      - run: python -u scripts/rescue_large_creator_booth_sources.py ${{ matrix.uid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave10-${{ matrix.uid }}-full
          path: rescue-booth-${{ matrix.uid }}/*-REAL-GLB-AND-CREATOR-SOURCE.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave10-${{ matrix.uid }}-glb
          path: rescue-booth-${{ matrix.uid }}/*-GLB-ONLY.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expovault-wave10-${{ matrix.uid }}-native
          path: rescue-booth-${{ matrix.uid }}/*-CREATOR-SOURCE-ONLY.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
